{
    "core": [
        "DATABASE",
        "SMTP",
        "AUTH",
        "INSTALLER"
    ],
    "modules": [
        "core"
    ],
    "plugins": [
        "bootstrap",
        "composer",
        "extensions",
        "installer",
        "logger",
        "maintenance",
        "stepper",
        "updater"
    ],
    "themes": [
        "default"
    ],
    "database_connectors": {
